name: Security and regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the complete history for the secret scan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install the locked frontend and backend dependencies
        run: |
          npm ci --no-fund
          npm ci --prefix server --no-fund

      - name: Check dependencies for known vulnerabilities
        run: |
          npm audit --audit-level=moderate
          npm audit --prefix server --audit-level=moderate

      - name: Build the production website
        run: npm run build

      - name: Lint the registration and staff security code
        run: >-
          npx --no-install eslint
          src/App.tsx src/main.tsx
          src/pages/gatekeeper/Gatekeeper.tsx
          src/utils/gatekeeperSession.ts src/utils/navigationContext.ts
          src/utils/registrationApi.ts src/utils/registrationSettings.ts

      - name: Test real Express routes with isolated payment, database and mail substitutes
        run: |
          node server/test-payment-flow.js
          node --test server/test-security-defenses.js

      - name: Install the checksum-verified secret scanner
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "${RUNNER_TEMP}/gitleaks.tar.gz" --directory "${RUNNER_TEMP}" gitleaks

      - name: Scan Git history and the production bundle without exposing secrets
        run: |
          "${RUNNER_TEMP}/gitleaks" git --log-opts=--all --redact --no-banner .
          "${RUNNER_TEMP}/gitleaks" dir --redact --no-banner dist
